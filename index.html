<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nels1Radar - Ofertas do Dia</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { color: #ff9900; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .status { background: #1e1e1e; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 0.9em; color: #888; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #252525; color: #ff9900; text-transform: uppercase; font-size: 0.8em; }
        tr:hover { background: #2a2a2a; }
        .preco-bom { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nels1Radar: Mar de Promoções B3</h1>
        <div class="status" id="status">Monitorando liquidez...</div>
        <table id="tabela-ofertas">
            <thead>
                <tr>
                    <th>Ativo</th>
                    <th>Preço/Taxa</th>
                    <th>Obs/Data</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // Busca os dados do arquivo ofertas.json
        fetch('ofertas.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#tabela-ofertas tbody');
                document.getElementById('status').innerText = "Última atualização do néctar: " + new Date().toLocaleDateString();
                data.forEach(item => {
                    const row = `<tr>
                        <td><strong>${item.ativo}</strong></td>
                        <td class="preco-bom">${item.preco}</td>
                        <td>${item.obs}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(err => document.getElementById('status').innerText = "Erro ao carregar o néctar: " + err);
    </script>
</body>
</html>
